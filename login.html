<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#c62828">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Comandas">
    <title>Comanda Online - Login</title>
    <link rel="manifest" href="manifest.php">
    <link rel="apple-touch-icon" href="icon-192.png">
    <script src="mobile-routing.js"></script>
    <link rel="stylesheet" href="style.css?v=20260417-desktop">
    <style>
        body.login-page {
            margin: 0;
            height: 100vh;
            min-height: 100vh;
            padding-top: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at 10% 18%, color-mix(in srgb, var(--c-secondary, #111827) 70%, transparent), transparent 34%),
                radial-gradient(circle at 88% 82%, color-mix(in srgb, var(--c-primary, #c4161c) 40%, transparent), transparent 44%),
                linear-gradient(160deg, #111827 0%, color-mix(in srgb, var(--c-secondary, #111827) 72%, #000) 100%);
            color: #f8fafc;
        }

        .robot-rain {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .robot-drop {
            position: absolute;
            bottom: -10px;
            top: -150px;
            width: var(--robot-size, 58px);
            height: auto;
            opacity: var(--robot-opacity, 0.32);
            filter: drop-shadow(0 3px 7px rgba(0, 0, 0, 0.45));
            animation: robotFall var(--robot-duration, 12s) linear var(--robot-delay, 0s) infinite;
        }

        .login-container {
            height: 100vh;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        .login-box {
            background: rgba(15, 23, 42, 0.9);
            border-radius: 12px;
            border: 1px solid color-mix(in srgb, var(--c-primary, #c4161c) 45%, transparent);
            padding: 36px;
            width: 100%;
            max-width: 430px;
            box-shadow: 0 36px 90px rgba(0,0,0,0.58), 0 0 0 1px color-mix(in srgb, var(--c-primary, #c4161c) 20%, transparent), inset 0 1px 0 rgba(255,255,255,0.06);
            backdrop-filter: blur(6px);
        }

        .login-box h1 {
            text-align: center;
            color: #f8fafc;
            margin-bottom: 10px;
            font-size: 2rem;
            letter-spacing: 0.02em;
        }

        .login-box .subtitle {
            text-align: center;
            color: #cbd5e1;
            margin-bottom: 30px;
            opacity: 0.92;
        }

        .system-sync-notice {
            display: none;
            margin: 0 0 18px;
            padding: 10px 12px;
            border-radius: 10px;
            background: linear-gradient(135deg, rgba(255, 193, 7, 0.16), rgba(255, 106, 0, 0.12));
            border: 1px solid rgba(255, 193, 7, 0.24);
            color: #ffe4b8;
            font-size: 0.83rem;
            line-height: 1.35;
            text-align: center;
            opacity: 0;
            transform: translateY(-4px);
            transition: opacity 0.35s ease, transform 0.35s ease;
        }

        .system-sync-notice.is-visible {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        .system-sync-notice.is-hiding {
            opacity: 0;
            transform: translateY(-6px);
        }

        .empresa-info {
            background: color-mix(in srgb, var(--c-primary, #c4161c) 20%, transparent);
            color: #f8fafc;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
            text-align: center;
            border: 1px solid color-mix(in srgb, var(--c-primary, #c4161c) 42%, transparent);
        }

        .empresa-info h2 {
            margin: 0;
            font-size: 1.5rem;
        }
        .empresa-info p {
            margin: 5px 0 0;
            opacity: 0.9;
        }
        .setup-box {
            display: none;
        }

        .login-box .form-group label {
            color: #e2e8f0;
            font-weight: 700;
        }

        .login-box .form-group input {
            background: rgba(255, 255, 255, 0.96);
            color: #0f172a;
            border: 2px solid color-mix(in srgb, var(--c-primary, #c4161c) 40%, transparent);
            border-radius: 8px;
            box-shadow: inset 0 1px 2px rgba(15, 23, 42, 0.08);
        }

        .login-box .form-group input::placeholder {
            color: #7f624f;
        }

        .login-box .form-group input:focus {
            border-color: var(--c-primary, #c4161c);
            box-shadow: 0 0 0 4px color-mix(in srgb, var(--c-primary, #c4161c) 28%, transparent);
        }

        .login-box .btn-primary {
            background: var(--c-primary, #c4161c);
            color: #fff;
            border: 1px solid color-mix(in srgb, var(--c-primary, #c4161c) 75%, #fff);
            font-weight: 700;
            letter-spacing: 0.02em;
        }

        .login-box .btn-primary:hover {
            background: color-mix(in srgb, var(--c-primary, #c4161c) 84%, #000);
            box-shadow: 0 8px 22px color-mix(in srgb, var(--c-primary, #c4161c) 35%, transparent);
        }

        @keyframes robotFall {
            from { transform: translateY(-150px) rotate(var(--robot-rotation, 0deg)); }
            to { transform: translateY(calc(100vh + 220px)) rotate(calc(var(--robot-rotation, 0deg) + 24deg)); }
        }

        @media (max-width: 768px) {
            .login-box {
                padding: 24px 20px;
                max-width: 94vw;
            }

        }
    </style>
</head>
<body class="login-page">
    <div class="robot-rain" aria-hidden="true"></div>
    <div class="login-container">
        <div class="login-box">
            <h1>Comanda Online</h1>
            <p class="subtitle">Sistema de Gerenciamento</p>
            <div id="systemSyncNotice" class="system-sync-notice" role="status" aria-live="polite">
                Sistema atualizado. Dados locais sincronizados.
            </div>
            
            <div id="empresaDisplay" class="empresa-info" style="display: none;">
                <h2 id="nomeEmpresa">Nome da Empresa</h2>
                <p>Bem-vindo!</p>
            </div>
            
            <div id="setupBox" class="setup-box">
                <h2>Configuração Inicial</h2>
                <p style="margin-bottom: 20px;">Bem-vindo! Configure sua empresa para começar.</p>
                <form id="formSetup">
                    <div class="form-group">
                        <label for="nomeEmpresaSetup">Nome da Empresa</label>
                        <input type="text" id="nomeEmpresaSetup" required>
                    </div>
                    <div class="form-group">
                        <label for="nomeAdmin">Seu Nome (Administrador)</label>
                        <input type="text" id="nomeAdmin" required>
                    </div>
                    <div class="form-group">
                        <label for="loginAdmin">Login</label>
                        <input type="text" id="loginAdmin" required>
                    </div>
                    <div class="form-group">
                        <label for="senhaAdmin">Senha</label>
                        <input type="password" id="senhaAdmin" required>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%;">Configurar Sistema</button>
                </form>
            </div>
            
            <form id="formLogin">
                <div class="form-group">
                    <label for="login">Login</label>
                    <input type="text" id="login" required>
                </div>
                <div class="form-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Entrar</button>
            </form>
        </div>
    </div>

    <script src="branding.js?v=20260417-mobile-logo"></script>
    <script src="api.js?v=20260430-hosting-challenge-retry"></script>
    <script src="toast.js"></script>
    <script src="storage.js?v=20260417-login-refresh"></script>
    <script src="pwa-register.js?v=20260505-swfix"></script>
    <script src="login-init.js?v=20260430-hosting-challenge-retry"></script>
    <script src="login-robots.js"></script>
</body>
</html>
