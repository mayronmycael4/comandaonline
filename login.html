<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#c62828">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Comandas">
    <title>Comanda Online - Login</title>
    <link rel="manifest" href="manifest.php">
    <link rel="apple-touch-icon" href="icon-192.png">
    <script src="mobile-routing.js"></script>
    <link rel="stylesheet" href="style.css?v=20260417-desktop">
    <style>
        body.login-page {
            margin: 0;
            min-height: 100vh;
            padding-top: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at 10% 18%, rgba(255, 126, 0, 0.34), transparent 34%),
                radial-gradient(circle at 88% 82%, rgba(196, 22, 28, 0.3), transparent 44%),
                radial-gradient(circle at 50% 110%, rgba(255, 188, 66, 0.22), transparent 48%),
                linear-gradient(160deg, #0f0b09 0%, #1d120e 45%, #120d0a 100%);
            color: #ffead0;
        }

        .login-fire-bg {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .ember-layer {
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 12% 100%, rgba(255, 140, 0, 0.44), transparent 40%),
                radial-gradient(circle at 36% 100%, rgba(255, 72, 0, 0.35), transparent 48%),
                radial-gradient(circle at 63% 100%, rgba(255, 42, 0, 0.24), transparent 42%),
                radial-gradient(circle at 84% 100%, rgba(255, 183, 76, 0.3), transparent 38%);
            filter: blur(7px);
            animation: emberPulse 3.9s ease-in-out infinite alternate;
        }

        .heat-haze {
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(175deg, rgba(255, 165, 90, 0.03) 0px, rgba(255, 165, 90, 0.03) 7px, rgba(255, 80, 0, 0.01) 8px, rgba(255, 80, 0, 0.01) 16px);
            mix-blend-mode: screen;
            opacity: 0.36;
            animation: hazeShift 6s ease-in-out infinite;
        }

        .flame {
            position: absolute;
            bottom: -170px;
            width: 320px;
            height: 420px;
            border-radius: 55% 45% 65% 35% / 72% 44% 56% 28%;
            background: radial-gradient(ellipse at 50% 68%, rgba(255, 221, 153, 0.5) 0%, rgba(255, 145, 0, 0.35) 44%, rgba(196, 22, 28, 0.12) 82%, transparent 100%);
            filter: blur(20px);
            mix-blend-mode: screen;
            opacity: 0.94;
            animation: flameRise 5.8s ease-in-out infinite;
        }

        .flame.f1 { left: 2%; animation-delay: 0s; }
        .flame.f2 { left: 20%; width: 360px; animation-delay: 0.8s; }
        .flame.f3 { left: 44%; width: 300px; animation-delay: 1.6s; }
        .flame.f4 { left: 63%; width: 340px; animation-delay: 2.4s; }
        .flame.f5 { left: 80%; width: 260px; animation-delay: 3.2s; }

        .spark {
            position: absolute;
            bottom: -10px;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: rgba(255, 220, 160, 0.9);
            box-shadow: 0 0 14px rgba(255, 193, 7, 0.96);
            opacity: 0;
            animation: sparkUp 3.3s linear infinite;
        }

        .spark.s1 { left: 18%; animation-delay: 0.2s; }
        .spark.s2 { left: 34%; animation-delay: 1.1s; }
        .spark.s3 { left: 51%; animation-delay: 2.1s; }
        .spark.s4 { left: 67%; animation-delay: 0.9s; }
        .spark.s5 { left: 82%; animation-delay: 2.8s; }
        .spark.s6 { left: 11%; animation-delay: 1.7s; }
        .spark.s7 { left: 58%; animation-delay: 0.4s; }
        .spark.s8 { left: 74%; animation-delay: 2.2s; }

        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        .login-box {
            background: linear-gradient(170deg, rgba(23, 16, 12, 0.9), rgba(34, 22, 15, 0.82));
            border-radius: 18px;
            border: 1px solid rgba(255, 193, 7, 0.3);
            padding: 36px;
            width: 100%;
            max-width: 430px;
            box-shadow: 0 36px 90px rgba(0,0,0,0.58), 0 0 0 1px rgba(255, 132, 0, 0.14), inset 0 1px 0 rgba(255,255,255,0.06);
            backdrop-filter: blur(6px);
        }

        .login-box h1 {
            text-align: center;
            color: #ffd9a3;
            margin-bottom: 10px;
            font-size: 2rem;
            letter-spacing: 0.02em;
        }

        .login-box .subtitle {
            text-align: center;
            color: #f4d8b6;
            margin-bottom: 30px;
            opacity: 0.92;
        }

        .system-sync-notice {
            display: none;
            margin: 0 0 18px;
            padding: 10px 12px;
            border-radius: 10px;
            background: linear-gradient(135deg, rgba(255, 193, 7, 0.16), rgba(255, 106, 0, 0.12));
            border: 1px solid rgba(255, 193, 7, 0.24);
            color: #ffe4b8;
            font-size: 0.83rem;
            line-height: 1.35;
            text-align: center;
            opacity: 0;
            transform: translateY(-4px);
            transition: opacity 0.35s ease, transform 0.35s ease;
        }

        .system-sync-notice.is-visible {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        .system-sync-notice.is-hiding {
            opacity: 0;
            transform: translateY(-6px);
        }

        .empresa-info {
            background: linear-gradient(135deg, rgba(255, 193, 7, 0.22), rgba(255, 106, 0, 0.2));
            color: #ffe9c5;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
            text-align: center;
            border: 1px solid rgba(255, 193, 7, 0.28);
        }

        .empresa-info h2 {
            margin: 0;
            font-size: 1.5rem;
        }
        .empresa-info p {
            margin: 5px 0 0;
            opacity: 0.9;
        }
        .setup-box {
            display: none;
        }

        .login-box .form-group label {
            color: #ffe2bc;
            font-weight: 700;
        }

        .login-box .form-group input {
            background: rgba(255, 248, 236, 0.96);
            color: #2c1809;
            border: 2px solid rgba(255, 162, 74, 0.35);
            border-radius: 11px;
            box-shadow: inset 0 1px 2px rgba(42, 22, 5, 0.08);
        }

        .login-box .form-group input::placeholder {
            color: #7f624f;
        }

        .login-box .form-group input:focus {
            border-color: #ffc107;
            box-shadow: 0 0 0 4px rgba(255, 193, 7, 0.26);
        }

        .login-box .btn-primary {
            background: linear-gradient(135deg, #c4161c, #ff6a00);
            color: #fff;
            border: 1px solid rgba(255, 193, 7, 0.35);
            font-weight: 700;
            letter-spacing: 0.02em;
        }

        .login-box .btn-primary:hover {
            background: linear-gradient(135deg, #d62828, #ff8c00);
            box-shadow: 0 8px 22px rgba(255, 106, 0, 0.28);
        }

        @keyframes flameRise {
            0% { transform: translateY(62px) scale(0.9) rotate(-3deg); opacity: 0.42; }
            45% { transform: translateY(-14px) scale(1.05) rotate(2deg); opacity: 0.98; }
            100% { transform: translateY(-92px) scale(1.16) rotate(-1deg); opacity: 0.5; }
        }

        @keyframes emberPulse {
            0% { transform: translateY(0) scale(1); opacity: 0.58; }
            100% { transform: translateY(-14px) scale(1.08); opacity: 0.96; }
        }

        @keyframes sparkUp {
            0% { transform: translateY(0) scale(0.9); opacity: 0; }
            14% { opacity: 0.98; }
            100% { transform: translateY(-360px) translateX(28px) scale(1.45); opacity: 0; }
        }

        @keyframes hazeShift {
            0% { transform: translateX(-12px) translateY(0); opacity: 0.24; }
            50% { transform: translateX(10px) translateY(-6px); opacity: 0.4; }
            100% { transform: translateX(-6px) translateY(0); opacity: 0.26; }
        }

        @media (max-width: 768px) {
            .login-box {
                padding: 24px 20px;
                max-width: 94vw;
            }

            .flame {
                width: 220px;
                height: 300px;
            }
        }
    </style>
</head>
<body class="login-page">
    <div class="login-fire-bg" aria-hidden="true">
        <div class="ember-layer"></div>
        <div class="heat-haze"></div>
        <span class="flame f1"></span>
        <span class="flame f2"></span>
        <span class="flame f3"></span>
        <span class="flame f4"></span>
        <span class="flame f5"></span>
        <span class="spark s1"></span>
        <span class="spark s2"></span>
        <span class="spark s3"></span>
        <span class="spark s4"></span>
        <span class="spark s5"></span>
        <span class="spark s6"></span>
        <span class="spark s7"></span>
        <span class="spark s8"></span>
    </div>
    <div class="login-container">
        <div class="login-box">
            <h1>Comanda Online</h1>
            <p class="subtitle">Sistema de Gerenciamento</p>
            <div id="systemSyncNotice" class="system-sync-notice" role="status" aria-live="polite">
                Sistema atualizado. Dados locais sincronizados.
            </div>
            
            <div id="empresaDisplay" class="empresa-info" style="display: none;">
                <h2 id="nomeEmpresa">Nome da Empresa</h2>
                <p>Bem-vindo!</p>
            </div>
            
            <div id="setupBox" class="setup-box">
                <h2>Configuração Inicial</h2>
                <p style="margin-bottom: 20px;">Bem-vindo! Configure sua empresa para começar.</p>
                <form id="formSetup">
                    <div class="form-group">
                        <label for="nomeEmpresaSetup">Nome da Empresa</label>
                        <input type="text" id="nomeEmpresaSetup" required>
                    </div>
                    <div class="form-group">
                        <label for="nomeAdmin">Seu Nome (Administrador)</label>
                        <input type="text" id="nomeAdmin" required>
                    </div>
                    <div class="form-group">
                        <label for="loginAdmin">Login</label>
                        <input type="text" id="loginAdmin" required>
                    </div>
                    <div class="form-group">
                        <label for="senhaAdmin">Senha</label>
                        <input type="password" id="senhaAdmin" required>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%;">Configurar Sistema</button>
                </form>
            </div>
            
            <form id="formLogin">
                <div class="form-group">
                    <label for="login">Login</label>
                    <input type="text" id="login" required>
                </div>
                <div class="form-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Entrar</button>
            </form>
        </div>
    </div>

    <script src="branding.js?v=20260417-mobile-logo"></script>
    <script src="api.js?v=20260430-hosting-challenge-retry"></script>
    <script src="toast.js"></script>
    <script src="storage.js?v=20260417-login-refresh"></script>
    <script src="pwa-register.js?v=20260505-swfix"></script>
    <script src="login-init.js?v=20260430-hosting-challenge-retry"></script>
</body>
</html>
