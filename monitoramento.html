<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comanda Online - Monitoramento</title>
    <link rel="stylesheet" href="style.css?v=20260417-desktop">
    <style>
        .monitor-wrap { max-width: 1300px; margin: 0 auto; padding: 16px; }
        .monitor-filters { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; align-items: center; }
        .monitor-filters input, .monitor-filters select { padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--text); }
        .monitor-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 18px; }
        .monitor-stat { background: linear-gradient(135deg, var(--c-red-dark), var(--c-red), var(--c-orange)); color: #fff8ea; border-radius: 14px; padding: 16px; }
        .monitor-stat h3 { margin: 0 0 8px; font-size: .95rem; font-weight: 700; letter-spacing: .02em; }
        .monitor-stat .num { font-size: 2rem; font-weight: 900; }
        .monitor-card { background: linear-gradient(180deg, var(--surface), var(--surface-2)); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 16px; }
        .monitor-card h2 { margin-top: 0; }
        .monitor-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .monitor-table th, .monitor-table td { border-bottom: 1px solid var(--border); padding: 8px 6px; text-align: left; vertical-align: top; }
        .monitor-table th { color: var(--text-soft); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
        .monitor-empty { color: var(--text-soft); padding: 12px 0; }
        .json-pre { margin: 0; white-space: pre-wrap; word-break: break-word; font-size: 12px; color: var(--text-soft); }
        @media (max-width: 960px) { .monitor-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="monitor-wrap">
        <header>
            <h1>Monitoramento</h1>
            <nav class="desktop-menu"></nav>
        </header>

        <main>
            <div class="monitor-filters">
                <input type="number" id="fLimit" min="1" max="200" value="25">
                <input type="text" id="fActor" placeholder="Actor ID">
                <button id="btnAtualizarMonitor" class="btn btn-primary">Atualizar</button>
            </div>

            <div class="monitor-grid">
                <div class="monitor-stat">
                    <h3>Action Log</h3>
                    <div class="num" id="statAction">0</div>
                </div>
                <div class="monitor-stat">
                    <h3>API Requests</h3>
                    <div class="num" id="statApi">0</div>
                </div>
                <div class="monitor-stat">
                    <h3>Erros</h3>
                    <div class="num" id="statErrors">0</div>
                </div>
            </div>

            <section class="monitor-card">
                <h2>Últimas ações</h2>
                <table class="monitor-table">
                    <thead>
                        <tr>
                            <th>Data</th>
                            <th>Usuário</th>
                            <th>Ação</th>
                            <th>Entidade</th>
                            <th>Detalhes</th>
                        </tr>
                    </thead>
                    <tbody id="actionBody">
                        <tr><td colspan="5" class="monitor-empty">Carregando...</td></tr>
                    </tbody>
                </table>
            </section>

            <section class="monitor-card">
                <h2>Últimas requisições API</h2>
                <table class="monitor-table">
                    <thead>
                        <tr>
                            <th>Data</th>
                            <th>Rota</th>
                            <th>Método</th>
                            <th>Status</th>
                            <th>Duração</th>
                        </tr>
                    </thead>
                    <tbody id="apiBody">
                        <tr><td colspan="5" class="monitor-empty">Carregando...</td></tr>
                    </tbody>
                </table>
            </section>

            <section class="monitor-card">
                <h2>Últimos erros</h2>
                <table class="monitor-table">
                    <thead>
                        <tr>
                            <th>Data</th>
                            <th>Rota</th>
                            <th>Status</th>
                            <th>Código</th>
                            <th>Mensagem</th>
                        </tr>
                    </thead>
                    <tbody id="errorBody">
                        <tr><td colspan="5" class="monitor-empty">Carregando...</td></tr>
                    </tbody>
                </table>
            </section>
        </main>
    </div>

    <script src="branding.js?v=20260828a"></script>
    <script src="api.js"></script>
    <script src="toast.js"></script>
    <script src="storage.js?v=20260828a"></script>
    <script src="menu-geral.js?v=20260519-ui-ajustes"></script>
    <script src="menu-admin.js?v=20260417-menu-geral3"></script>
    <script src="monitoramento-init.js?v=20260519-ui-ajustes"></script>
</body>
</html>
