<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#8B4513">
    <title>Produtos - Mobile</title>
    <link rel="stylesheet" href="../assets/style.css">
    <link rel="stylesheet" href="../assets/mobile-first.css?v=20260417-navfit">
<link rel="stylesheet" href="../assets/ui-theme.css?v=20260909r2">
<link rel="stylesheet" href="../assets/ui-shell.css?v=20260911r4">
<script defer src="../assets/ui-shell.js?v=20260911r4"></script>
</head>
<body>
    <header>
        <div class="brand-block">
            <div class="brand-logo-wrap" id="brandLogoWrapProdutosMobile"></div>
            <div class="brand-text-wrap">
                <div class="brand-title" id="nomeEmpresaHeaderProdutosMobile">Comanda</div>
                <div class="brand-subtitle">Produtos</div>
            </div>
        </div>
    </header>

    <div class="container mobile-dashboard-page admin-mobile-page">
        <main>
            <section class="card">
                <h2>Cadastrar Produto</h2>
                <form id="formProduto">
                    <div class="form-group">
                        <label for="nomeProduto">Nome do Produto</label>
                        <input type="text" id="nomeProduto" required>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="categoriaProduto">Categoria</label>
                            <select id="categoriaProduto" required>
                                <option value="">Selecione...</option>
                                <option value="bebidas">Bebidas</option>
                                <option value="espetos">Espetos</option>
                                <option value="hamburgers">Hamburgers</option>
                                <option value="outros">Outros</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="precoProduto">Preco (R$)</label>
                            <input type="number" id="precoProduto" step="0.01" min="0" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary">Cadastrar Produto</button>
                </form>
            </section>

            <section class="card">
                <h2>Produtos Cadastrados</h2>
                <div class="form-row" style="margin-bottom: 10px;">
                    <div class="form-group">
                        <label for="buscaProduto">Buscar</label>
                        <input type="text" id="buscaProduto" placeholder="Ex.: Coca, Espeto...">
                    </div>
                    <div class="form-group">
                        <label for="filtroCategoriaProduto">Categoria</label>
                        <select id="filtroCategoriaProduto">
                            <option value="todos">Todas</option>
                            <option value="bebidas">Bebidas</option>
                            <option value="espetos">Espetos</option>
                            <option value="hamburgers">Hamburgers</option>
                            <option value="outros">Outros</option>
                        </select>
                    </div>
                </div>
                <div class="categoria-section">
                    <h3>Bebidas</h3>
                    <div id="listaBebidas" class="lista-produtos"><p class="empty">Nenhuma bebida cadastrada.</p></div>
                </div>
                <div class="categoria-section">
                    <h3>Espetos</h3>
                    <div id="listaEspetos" class="lista-produtos"><p class="empty">Nenhum espeto cadastrado.</p></div>
                </div>
                <div class="categoria-section">
                    <h3>Hamburgers</h3>
                    <div id="listaHamburgers" class="lista-produtos"><p class="empty">Nenhum hamburger cadastrado.</p></div>
                </div>
                <div class="categoria-section">
                    <h3>Outros</h3>
                    <div id="listaOutros" class="lista-produtos"><p class="empty">Nenhum produto em outros.</p></div>
                </div>
            </section>
        </main>
    </div>

    <div id="modalEditarProduto" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Editar Produto</h3>
                <button type="button" class="modal-close" id="btnFecharModalProduto">?-</button>
            </div>
            <form id="formEditarProduto">
                <input type="hidden" id="editarProdutoId">
                <div class="form-group">
                    <label for="editarNomeProduto">Nome do Produto</label>
                    <input type="text" id="editarNomeProduto" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="editarCategoriaProduto">Categoria</label>
                        <select id="editarCategoriaProduto" required>
                            <option value="bebidas">Bebidas</option>
                            <option value="espetos">Espetos</option>
                            <option value="hamburgers">Hamburgers</option>
                            <option value="outros">Outros</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="editarPrecoProduto">Preco (R$)</label>
                        <input type="number" id="editarPrecoProduto" step="0.01" min="0" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-light" id="btnCancelarEdicaoProduto">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Salvar alteracoes</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../assets/branding.js?v=20260417-mobile-logo"></script>
    <script src="../assets/api.js"></script>
    <script src="../assets/toast.js"></script>
    <script src="../assets/storage.js?v=20260914time2"></script>
    <script src="../assets/comanda-module.js?v=20260505-acentos"></script>
    <script src="../assets/menu-geral.js?v=20260505-mobile-ajustes"></script>
    <script src="../assets/mobile-navbar.js?v=20260505-mobile-ajustes"></script>
    <script src="../assets/pwa-register.js?v=20260505-swfix"></script>
    <script src="../assets/produtos.js"></script>
</body>
</html>
