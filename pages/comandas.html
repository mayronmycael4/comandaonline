<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#8B4513">
    <script src="assets/mobile-routing.js"></script>
    <title>Comanda Online - Todas as Comandas</title>
    <link rel="stylesheet" href="assets/style.css">
    <link rel="stylesheet" href="assets/mobile-first.css">
<link rel="stylesheet" href="assets/ui-theme.css?v=20260909r2">
<link rel="stylesheet" href="assets/ui-shell.css?v=20260911r4">
<script defer src="assets/ui-shell.js?v=20260911r4"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Todas as Comandas</h1>
            <nav class="desktop-menu"></nav>
        </header>

        <main>
            <section class="card">
                <h2>Filtrar Comandas</h2>
                <div class="mobile-comanda-tools">
                    <div class="form-group">
                        <label for="buscaComanda">Busca Rápida</label>
                        <input type="text" id="buscaComanda" placeholder="Mesa, cliente ou responsável">
                    </div>
                    <div class="status-chips" id="statusChipsComandas">
                        <button type="button" class="status-chip active" data-quick-status="todos">Todas</button>
                        <button type="button" class="status-chip" data-quick-status="aberta">Abertas</button>
                        <button type="button" class="status-chip" data-quick-status="fechada">Fechadas</button>
                        <button type="button" class="status-chip" data-quick-status="cancelada">Canceladas</button>
                    </div>
                    <p id="resumoComandasMobile" class="hint">Use os filtros para encontrar comandas rapidamente.</p>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="filtroStatus">Status</label>
                        <select id="filtroStatus">
                            <option value="todos">Todos</option>
                            <option value="aberta">Abertas</option>
                            <option value="fechada">Fechadas</option>
                            <option value="cancelada">Canceladas</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="filtroFuncionario">Funcionário</label>
                        <select id="filtroFuncionario">
                            <option value="todos">Todos</option>
                        </select>
                    </div>
                </div>
                <button id="btnAplicarFiltros" type="button" class="btn btn-primary">Aplicar Filtros</button>
            </section>

            <section class="card">
                <h2>Comandas Abertas</h2>
                <div id="listaComandasAbertas" class="lista-grid">
                    <p class="empty">Nenhuma comanda aberta.</p>
                </div>
            </section>

            <section class="card">
                <h2>Comandas Fechadas</h2>
                <div id="listaComandasFechadas" class="lista-grid">
                    <p class="empty">Nenhuma comanda fechada.</p>
                </div>
            </section>

            <section class="card">
                <h2>Histórico - Comandas Abertas Recentes</h2>
                <div id="ultimasComandas" class="lista-detalhada">
                    <p class="empty">Nenhuma comanda aberta recentemente.</p>
                </div>
            </section>
        </main>
    </div>

    <script src="assets/branding.js?v=20260828a"></script>
    <script src="assets/api.js"></script>
    <script src="assets/toast.js"></script>
    <script src="assets/storage.js?v=20260914time2"></script>
    <script src="assets/comanda-module.js?v=20260505-acentos"></script>
    <script src="assets/menu-geral.js?v=20260505-mobile-ajustes"></script>
    <script src="assets/menu-admin.js?v=20260417-menu-geral3"></script>
    <script src="assets/mobile-navbar.js?v=20260505-mobile-ajustes"></script>
    <script src="assets/pwa-register.js?v=20260505-swfix"></script>
    <script src="assets/comandas-init.js"></script>
</body>
</html>
