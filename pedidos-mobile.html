<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Comandas">
    <meta name="theme-color" content="#c62828">
    <title>Pedidos - Mobile</title>
    <link rel="manifest" href="manifest.php">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <header>
        <div class="brand-block">
            <div class="brand-logo-wrap" id="brandLogoWrapPedidos"></div>
            <div class="brand-text-wrap">
                <div class="brand-title" id="nomeEmpresaHeaderPedidos">Comanda</div>
                <div class="brand-subtitle">Pedidos</div>
            </div>
        </div>
        <button id="btnLogoutPedidos" type="button" class="btn-logout">Sair</button>
    </header>

    <div class="container mobile-dashboard-page">
        <main>
            <section class="card">
                <h2>Filtro de Pedidos</h2>
                <div class="form-group">
                    <label for="buscaPedidosMobile">Buscar</label>
                    <input type="text" id="buscaPedidosMobile" placeholder="Mesa, cliente, responsável">
                </div>
                <div class="status-chips" id="statusChipsPedidosMobile">
                    <button type="button" class="status-chip active" data-pedido-status="aberta">Abertas</button>
                    <button type="button" class="status-chip" data-pedido-status="fechada">Fechadas</button>
                    <button type="button" class="status-chip" data-pedido-status="todos">Todas</button>
                </div>
                <p id="resumoPedidosMobile" class="hint">Carregando pedidos...</p>
            </section>

            <section class="card">
                <h2>Lista de Pedidos</h2>
                <div id="listaPedidosMobile" class="lista-grid">
                    <p class="empty">Nenhum pedido encontrado.</p>
                </div>
            </section>
        </main>
    </div>

    <script src="branding.js?v=20260417-mobile-logo"></script>
    <script src="api.js"></script>
    <script src="toast.js"></script>
