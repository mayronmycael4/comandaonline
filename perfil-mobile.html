<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Comandas">
    <meta name="theme-color" content="#c62828">
    <title>Perfil - Mobile</title>
    <link rel="manifest" href="manifest.php">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="stylesheet" href="style.css?v=20260519-ui-ajustes">
    <link rel="stylesheet" href="mobile-first.css?v=20260417-navfit">
</head>
<body>
    <header>
        <div class="brand-block">
            <div class="brand-logo-wrap" id="brandLogoWrapPerfil"></div>
            <div class="brand-text-wrap">
                <div class="brand-title" id="nomeEmpresaHeaderPerfil">Comanda</div>
                <div class="brand-subtitle">Perfil</div>
            </div>
        </div>
    </header>

    <div class="container mobile-dashboard-page">
        <main>
            <section class="card">
                <h2>Minha Conta</h2>
                <div class="profile-mobile-row"><span>Nome</span><strong id="perfilNomeMobile">-</strong></div>
                <div class="profile-mobile-row"><span>Login</span><strong id="perfilLoginMobile">-</strong></div>
                <div class="profile-mobile-row"><span>Função</span><strong id="perfilFuncaoMobile">-</strong></div>
            </section>

            <section class="card">
                <h2>Preferências</h2>
                <label for="seletorTemaMobile">Tema</label>
                <select id="seletorTemaMobile">
                    <option value="system">Tema do sistema</option>
                    <option value="light">Claro</option>
                    <option value="dark">Escuro</option>
                </select>
                <p class="hint">A alteração é aplicada imediatamente.</p>

                <hr style="margin: 16px 0; border: 0; border-top: 1px solid rgba(0,0,0,0.08);">

                <h3 style="margin-top: 0;">Som da Cozinha</h3>
                <label style="display:flex; align-items:center; gap:8px; margin-bottom: 8px;">
                    <input type="checkbox" id="perfilSomAtivoMobile" checked>
                    Ativar som de novo pedido
                </label>
                <label for="perfilAudioMobile">Áudio personalizado (mp3/wav/ogg)</label>
                <input type="file" id="perfilAudioMobile" accept="audio/*">
                <p id="perfilAudioAtualMobile" class="hint">Usando som padrão do sistema.</p>
                <div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;">
                    <button id="btnSalvarSomPerfilMobile" type="button" class="btn btn-primary">Salvar Som</button>
                    <button id="btnTestarSomPerfilMobile" type="button" class="btn btn-secondary">Testar</button>
                    <button id="btnRemoverSomPerfilMobile" type="button" class="btn btn-danger">Remover Áudio</button>
                </div>
            </section>

            <section class="card" id="secaoFerramentasGestao" style="display: none;">
                <h2>Ferramentas de Gestão</h2>
                <div class="admin-shortcuts-grid" id="atalhosGestaoMobile"></div>
            </section>

            <section class="card">
                <h2>Sessão</h2>
                <button id="btnLogoutPerfilMobile" type="button" class="btn btn-danger">Sair da Conta</button>
            </section>
        </main>
    </div>

    <script src="branding.js?v=20260417-mobile-logo"></script>
    <script src="api.js"></script>
    <script src="toast.js"></script>
    <script src="storage.js?v=20260828a"></script>
    <script src="menu-geral.js?v=20260519-ui-ajustes"></script>
    <script src="mobile-navbar.js?v=20260505-mobile-ajustes"></script>
    <script src="pwa-register.js?v=20260505-swfix"></script>
    <script src="perfil-mobile.js?v=20260519-ui-ajustes"></script>
</body>
</html>
